# fly.io 설정 - 도쿄(nrt) 리전
# app 이름은 `fly launch` 시 고유한 이름으로 다시 지정해도 됩니다.
app = "saenggibu-doumi"
primary_region = "nrt"

[build]

[env]
  DEBUG = "false"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # 0이면 트래픽이 없을 때 머신이 완전히 꺼져 비용이 거의 발생하지 않는 대신,
  # 한동안 접속이 없다가 처음 들어오는 사용자는 콜드 스타트(수 초)를 겪는다.
  # 학기 말에만 주로 쓰는 서비스라 비용 절감을 위해 0으로 둔다. 1로 바꾸면
  # 항상 1대가 켜져 콜드 스타트가 사라지지만 Fly.io 비용이 상시 발생한다.
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
